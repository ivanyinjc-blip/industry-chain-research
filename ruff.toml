line-length = 100
target-version = "py310"

[lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # line-too-long
    "B008",  # function call in default argument
    "E402",  # module level import not at top (我们故意为之,环境变量加载后)
]

[lint.per-file-ignores]
"tests/*" = ["E402", "B011"]
"chain-stockmap/scripts/_lib/*" = ["E402"]
