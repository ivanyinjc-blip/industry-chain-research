name: CI

on:
  push:
    branches: [main, dev/**]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (ubuntu-latest, py3.12)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Test with pytest
        run: |
          pytest tests/ -v --tb=short --cov=chain-stockmap --cov=chain-radar --cov-report=term-missing

      - name: Verify no hardcoded paths
        run: |
          if grep -rn "/mnt/[a-z]" --include="*.py" .; then
            echo "❌ 发现硬编码 /mnt/* 路径"
            exit 1
          fi

      - name: Verify requirements.txt is complete
        run: |
          python -c "
          req = open('requirements.txt').read()
          for dep in ['akshare', 'duckdb', 'Pillow', 'requests', 'pytest']:
              assert dep in req, f'缺少 {dep}'
          print('✅ requirements.txt 完整')
          "
